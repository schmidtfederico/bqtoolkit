[tox]
envlist = py{38,39,310,311,312,313,314}

minversion = 3.14.0

isolated_build = true

requires =
    pip >= 20.0.0

[testenv:py314]
setenv =
    GOOGLE_APPLICATION_CREDENTIALS=pytest@bqtoolkit.json

[testenv]
deps =
    check-manifest
    flake8<5.0.0
    pytest
extras = testing
commands =
    check-manifest --ignore tox.ini
    python setup.py check -m -s
    py.test tests

[flake8]
exclude = .tox,*.egg,build,data,venv,utils,docs
select = E,W,F